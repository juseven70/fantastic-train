<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>対局タイマー + ランダムナンバー</title>
    <style>
        :root {
            --bg-color: #222;
            --active-color: #4CAF50;
            --pause-color: #ff9800;
            --win-color: #ffd700;
            --lose-color: #ff4b2b;
            --number-color: #00d4ff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            user-select: none;
        }

        /* 画面上部の数字表示エリア */
        #number-display {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12vw;
            font-weight: 900;
            color: var(--number-color);
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }

        /* リセット表示の時のサイズ調整 */
        .reset-text {
            font-size: 8vw !important;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .timer-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            outline: none;
            transition: all 0.3s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding-top: 10vh;
        }

        #side-left { background-color: #333; color: #aaa; }
        #side-right { background-color: #444; color: #aaa; }

        .active { background-color: var(--active-color) !important; color: white !important; }
        .time-display { font-size: 15vw; font-weight: 800; font-family: monospace; }
        .status-label { font-size: 3vw; font-weight: bold; opacity: 0.7; }

        .win { background-color: var(--win-color) !important; color: #000 !important; }
        .lose { background-color: var(--lose-color) !important; color: white !important; }

        .controls {
            position: absolute;
            bottom: 10%; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .btn-ctrl {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #pause-btn { background-color: var(--pause-color); color: white; }
        #reset-btn { background-color: #666; color: white; }
    </style>
</head>
<body>

    <div id="number-display">--</div>

    <div class="controls">
        <button id="pause-btn" class="btn-ctrl">PAUSE</button>
        <button id="reset-btn" class="btn-ctrl">RESET</button>
    </div>

    <div class="container">
        <button id="side-left" class="timer-side">
            <div class="status-label">PLAYER 1</div>
            <div id="display-left" class="time-display">05:00</div>
        </button>

        <button id="side-right" class="timer-side">
            <div class="status-label">PLAYER 2</div>
            <div id="display-right" class="time-display">05:00</div>
        </button>
    </div>

    <script>
        const INITIAL_TIME = 5 * 60;
        let timeLeft1 = INITIAL_TIME;
        let timeLeft2 = INITIAL_TIME;
        let activePlayer = null; 
        let isPaused = false;
        let timerInterval = null;
        let gameOver = false;

        let numberPool = [];
        const numDisplay = document.getElementById('number-display');

        // 数字セットの初期化
        function initNumberPool() {
            numberPool = [];
            for (let i = 2; i <= 11; i++) {
                for (let j = 0; j < 4; j++) {
                    numberPool.push(i);
                }
            }
            // フィッシャー・イェーツのシャッフル
            for (let i = numberPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numberPool[i], numberPool[j]] = [numberPool[j], numberPool[i]];
            }
        }

        // 数字を取得する関数
        function drawNextNumber() {
            // もし山札が空なら、新しく作って「リセット＋最初の数字」を返す
            if (numberPool.length === 0) {
                initNumberPool();
                const nextVal = numberPool.pop();
                numDisplay.classList.add('reset-text'); // 文字を少し小さくする
                return `RESET: ${nextVal}`;
            }
            
            numDisplay.classList.remove('reset-text');
            return numberPool.pop();
        }

        const sideL = document.getElementById('side-left');
        const sideR = document.getElementById('side-right');
        const dispL = document.getElementById('display-left');
        const dispR = document.getElementById('display-right');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function updateDisplay() {
            if (!gameOver) {
                dispL.textContent = formatTime(timeLeft1);
                dispR.textContent = formatTime(timeLeft2);
            }
            sideL.classList.toggle('active', activePlayer === 1 && !isPaused);
            sideR.classList.toggle('active', activePlayer === 2 && !isPaused);
        }

        function endGame(loser) {
            gameOver = true;
            clearInterval(timerInterval);
            if (loser === 1) {
                sideL.classList.add('lose');
                sideR.classList.add('win');
                dispL.textContent = "LOSE";
                dispR.textContent = "WIN";
            } else {
                sideR.classList.add('lose');
                sideL.classList.add('win');
                dispR.textContent = "LOSE";
                dispL.textContent = "WIN";
            }
        }

        function tick() {
            if (isPaused || gameOver) return;
            if (activePlayer === 1) {
                timeLeft1--;
                if (timeLeft1 <= 0) endGame(1);
            } else if (activePlayer === 2) {
                timeLeft2--;
                if (timeLeft2 <= 0) endGame(2);
            }
            updateDisplay();
        }

        function switchPlayer(toPlayer) {
            if (gameOver) return;
            
            // 数字を表示（山札が切れたらRESETと一緒に次の数が出る）
            numDisplay.textContent = drawNextNumber();

            isPaused = false;
            pauseBtn.textContent = "PAUSE";
            activePlayer = toPlayer;
            
            if (!timerInterval) {
                timerInterval = setInterval(tick, 1000);
            }
            updateDisplay();
        }

        sideL.addEventListener('click', () => {
            if (activePlayer === 2 && !isPaused) return;
            switchPlayer(2);
        });

        sideR.addEventListener('click', () => {
            if (activePlayer === 1 && !isPaused) return;
            switchPlayer(1);
        });

        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameOver || activePlayer === null) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "RESUME" : "PAUSE";
            updateDisplay();
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft1 = INITIAL_TIME;
            timeLeft2 = INITIAL_TIME;
            activePlayer = null;
            isPaused = false;
            gameOver = false;
            numDisplay.textContent = "--";
            numDisplay.classList.remove('reset-text');
            initNumberPool();
            pauseBtn.textContent = "PAUSE";
            sideL.className = 'timer-side';
            sideR.className = 'timer-side';
            updateDisplay();
        });

        initNumberPool();
    </script>
</body>
</html>
