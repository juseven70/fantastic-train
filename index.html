<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>対局タイマー + ランダムナンバー</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --active-color: #2ecc71;
            --pause-color: #f39c12;
            --win-color: #f1c40f;
            --lose-color: #e74c3c;
            --number-color: #3498db;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Avenir', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            user-select: none;
        }

        /* 上部の数字表示 */
        #number-display {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15vw;
            font-weight: 900;
            color: var(--number-color);
            text-shadow: 0 0 30px rgba(52, 152, 219, 0.4);
            z-index: 10;
            pointer-events: none;
        }

        .reset-text {
            font-size: 8vw !important; /* RESET表示の時は文字を少し小さく */
            color: #fff !important;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .timer-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            outline: none;
            transition: background-color 0.2s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding-top: 15vh;
        }

        #side-left { background-color: #2c3e50; color: #95a5a6; }
        #side-right { background-color: #34495e; color: #95a5a6; border-left: 1px solid #222; }

        .active { background-color: var(--active-color) !important; color: white !important; }
        .time-display { font-size: 15vw; font-weight: bold; font-family: 'Courier New', monospace; }
        .status-label { font-size: 3vw; font-weight: bold; opacity: 0.6; margin-bottom: 10px; }

        .win { background-color: var(--win-color) !important; color: #000 !important; }
        .lose { background-color: var(--lose-color) !important; color: white !important; }

        /* 中央コントロール */
        .controls {
            position: absolute;
            bottom: 8%; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .btn-ctrl {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background-color: #555;
            color: white;
        }
        #pause-btn { background-color: var(--pause-color); }
    </style>
</head>
<body>

    <div id="number-display">--</div>

    <div class="controls">
        <button id="pause-btn" class="btn-ctrl">PAUSE</button>
        <button id="reset-btn" class="btn-ctrl">RESET</button>
    </div>

    <div class="container">
        <button id="side-left" class="timer-side">
            <div class="status-label">PLAYER 1</div>
            <div id="display-left" class="time-display">05:00</div>
        </button>

        <button id="side-right" class="timer-side">
            <div class="status-label">PLAYER 2</div>
            <div id="display-right" class="time-display">05:00</div>
        </button>
    </div>

    <script>
        const INITIAL_TIME = 5 * 60;
        let timeLeft1 = INITIAL_TIME;
        let timeLeft2 = INITIAL_TIME;
        let activePlayer = null; 
        let isPaused = false;
        let timerInterval = null;
        let gameOver = false;

        let numberPool = [];
        const numDisplay = document.getElementById('number-display');

        // 山札（40枚）を作成・シャッフルする関数
        function initNumberPool() {
            numberPool = [];
            // 2から11までを各4回ずつ追加
            for (let i = 2; i <= 11; i++) {
                for (let j = 0; j < 4; j++) {
                    numberPool.push(i);
                }
            }
            // シャッフル（Fisher-Yates法）
            for (let i = numberPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numberPool[i], numberPool[j]] = [numberPool[j], numberPool[i]];
            }
            console.log("新しい山札を用意しました（40枚）");
        }

        // 山札から1枚引く関数
        function drawNextNumber() {
            if (numberPool.length === 0) {
                // 山札が空になったらリセット
                initNumberPool();
                const nextVal = numberPool.pop();
                numDisplay.classList.add('reset-text');
                return `RESET: ${nextVal}`;
            }
            
            numDisplay.classList.remove('reset-text');
            return numberPool.pop();
        }

        const sideL = document.getElementById('side-left');
        const sideR = document.getElementById('side-right');
        const dispL = document.getElementById('display-left');
        const dispR = document.getElementById('display-right');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function updateDisplay() {
            if (!gameOver) {
                dispL.textContent = formatTime(timeLeft1);
                dispR.textContent = formatTime(timeLeft2);
            }
            sideL.classList.toggle('active', activePlayer === 1 && !isPaused);
            sideR.classList.toggle('active', activePlayer === 2 && !isPaused);
        }

        function endGame(loser) {
            gameOver = true;
            clearInterval(timerInterval);
            if (loser === 1) {
                sideL.classList.add('lose'); sideR.classList.add('win');
                dispL.textContent = "LOSE"; dispR.textContent = "WIN";
            } else {
                sideR.classList.add('lose'); sideL.classList.add('win');
                dispR.textContent = "LOSE"; dispL.textContent = "WIN";
            }
        }

        function tick() {
            if (isPaused || gameOver) return;
            if (activePlayer === 1) {
                timeLeft1--;
                if (timeLeft1 <= 0) endGame(1);
            } else if (activePlayer === 2) {
                timeLeft2--;
                if (timeLeft2 <= 0) endGame(2);
            }
            updateDisplay();
        }

        function switchPlayer(toPlayer) {
            if (gameOver) return;
            numDisplay.textContent = drawNextNumber();
            isPaused = false;
            pauseBtn.textContent = "PAUSE";
            activePlayer = toPlayer;
            if (!timerInterval) timerInterval = setInterval(tick, 1000);
            updateDisplay();
        }

        sideL.addEventListener('click', () => {
            if (activePlayer === 2 && !isPaused) return;
            switchPlayer(2);
        });

        sideR.addEventListener('click', () => {
            if (activePlayer === 1 && !isPaused) return;
            switchPlayer(1);
        });

        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameOver || activePlayer === null) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "RESUME" : "PAUSE";
            updateDisplay();
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft1 = INITIAL_TIME;
            timeLeft2 = INITIAL_TIME;
            activePlayer = null;
            isPaused = false;
            gameOver = false;
            numDisplay.textContent = "--";
            numDisplay.classList.remove('reset-text');
            initNumberPool();
            pauseBtn.textContent = "PAUSE";
            sideL.className = 'timer-side';
            sideR.className = 'timer-side';
            updateDisplay();
        });

        // 起動時に最初の山札を作成
        initNumberPool();
    </script>
</body>
</html>
