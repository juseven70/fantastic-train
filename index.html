<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>対局タイマー PRO - 時間調整付</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --active-color: #4CAF50;
            --pause-color: #f39c12;
            --win-color: #2ecc71;  /* 緑 */
            --lose-color: #ff7675; /* 薄い赤 */
            --number-color: #3498db;
            --text-color: #eee;
            --arrow-color: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            user-select: none;
        }

        /* 上部のランダム数字 */
        #number-display {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14vw;
            font-weight: 900;
            color: var(--number-color);
            text-shadow: 0 0 25px rgba(52, 152, 219, 0.5);
            z-index: 10;
            pointer-events: none;
            transition: all 0.2s;
        }
        .reset-text { font-size: 8vw !important; color: #fff !important; }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左右のボタンエリア */
        .timer-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
            padding-top: 10vh;
            -webkit-tap-highlight-color: transparent;
        }

        #side-left { background-color: #2c3e50; border-right: 1px solid #111; }
        #side-right { background-color: #34495e; }

        /* 動作中の色 */
        .active { background-color: var(--active-color) !important; color: white !important; }
        .win { background-color: var(--win-color) !important; color: white !important; }
        .lose { background-color: var(--lose-color) !important; color: white !important; }

        /* 時間表示のパーツ */
        .time-wrapper {
            display: flex;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .digit-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-val { font-size: 14vw; line-height: 1; margin: 5px 0; }
        .separator { font-size: 10vw; margin: 0 5px; }

        /* 調整ボタン */
        .adjust-btn {
            background: none;
            border: none;
            color: var(--arrow-color);
            font-size: 5vw;
            padding: 5px 15px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .adjust-btn:active { transform: scale(1.3); color: white; }

        /* ゲーム開始後はボタンを消す */
        .game-started .adjust-btn {
            display: none;
        }

        .status-label {
            font-size: 2.5vw;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        /* 中央コントロール */
        .controls {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .btn-ctrl {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background-color: #444;
            color: white;
            transition: transform 0.1s;
        }
        .btn-ctrl:active { transform: scale(0.95); }
        #pause-btn { background-color: var(--pause-color); }
    </style>
</head>
<body>

    <div id="number-display">--</div>

    <div class="controls">
        <button id="pause-btn" class="btn-ctrl">PAUSE</button>
        <button id="reset-btn" class="btn-ctrl">RESET</button>
    </div>

    <div class="container" id="main-ui">
        <!-- PLAYER 1 (LEFT) -->
        <div id="side-left" class="timer-side" onclick="onSideClick(2)">
            <div class="status-label">Player 1</div>
            <div class="time-wrapper">
                <div class="digit-box">
                    <button class="adjust-btn" onclick="modifyTime(1, 60, event)">▲</button>
                    <div id="m1" class="time-val">05</div>
                    <button class="adjust-btn" onclick="modifyTime(1, -60, event)">▼</button>
                </div>
                <div class="separator">:</div>
                <div class="digit-box">
                    <button class="adjust-btn" onclick="modifyTime(1, 1, event)">▲</button>
                    <div id="s1" class="time-val">00</div>
                    <button class="adjust-btn" onclick="modifyTime(1, -1, event)">▼</button>
                </div>
            </div>
        </div>

        <!-- PLAYER 2 (RIGHT) -->
        <div id="side-right" class="timer-side" onclick="onSideClick(1)">
            <div class="status-label">Player 2</div>
            <div class="time-wrapper">
                <div class="digit-box">
                    <button class="adjust-btn" onclick="modifyTime(2, 60, event)">▲</button>
                    <div id="m2" class="time-val">05</div>
                    <button class="adjust-btn" onclick="modifyTime(2, -60, event)">▼</button>
                </div>
                <div class="separator">:</div>
                <div class="digit-box">
                    <button class="adjust-btn" onclick="modifyTime(2, 1, event)">▲</button>
                    <div id="s2" class="time-val">00</div>
                    <button class="adjust-btn" onclick="modifyTime(2, -1, event)">▼</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 設定値
        let timeLeft1 = 300;
        let timeLeft2 = 300;
        let activePlayer = null;
        let timerInterval = null;
        let isPaused = false;
        let gameOver = false;
        let gameStarted = false;

        let numberPool = [];
        const numDisplay = document.getElementById('number-display');
        const mainUI = document.getElementById('main-ui');

        // 数字プール初期化 (2-11を各4回)
        function initPool() {
            numberPool = [];
            for (let n = 2; n <= 11; n++) {
                for (let i = 0; i < 4; i++) numberPool.push(n);
            }
            // シャッフル
            for (let i = numberPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numberPool[i], numberPool[j]] = [numberPool[j], numberPool[i]];
            }
        }

        // 次の数字を引く
        function getNextNumber() {
            if (numberPool.length === 0) {
                initPool();
                const n = numberPool.pop();
                numDisplay.classList.add('reset-text');
                return "RESET: " + n;
            }
            numDisplay.classList.remove('reset-text');
            return numberPool.pop();
        }

        // 時間調整 (秒単位)
        function modifyTime(player, seconds, event) {
            event.stopPropagation(); // 背景のクリック（ゲーム開始）を防ぐ
            if (gameStarted) return;

            if (player === 1) {
                timeLeft1 = Math.max(1, timeLeft1 + seconds);
            } else {
                timeLeft2 = Math.max(1, timeLeft2 + seconds);
            }
            render();
        }

        // 画面更新
        function render() {
            const m1 = Math.floor(timeLeft1 / 60);
            const s1 = timeLeft1 % 60;
            const m2 = Math.floor(timeLeft2 / 60);
            const s2 = timeLeft2 % 60;

            document.getElementById('m1').textContent = String(m1).padStart(2, '0');
            document.getElementById('s1').textContent = String(s1).padStart(2, '0');
            document.getElementById('m2').textContent = String(m2).padStart(2, '0');
            document.getElementById('s2').textContent = String(s2).padStart(2, '0');

            const sideL = document.getElementById('side-left');
            const sideR = document.getElementById('side-right');

            sideL.classList.toggle('active', activePlayer === 1 && !isPaused);
            sideR.classList.toggle('active', activePlayer === 2 && !isPaused);

            if (gameStarted) mainUI.classList.add('game-started');
            else mainUI.classList.remove('game-started');
        }

        // どちらかのボタンが押されたとき
        function onSideClick(targetPlayer) {
            if (gameOver) return;

            // 初回クリック時にゲーム開始
            if (!gameStarted) {
                gameStarted = true;
                initPool();
            }

            // ランダム数字更新
            numDisplay.textContent = getNextNumber();

            activePlayer = targetPlayer;
            isPaused = false;
            document.getElementById('pause-btn').textContent = "PAUSE";

            if (!timerInterval) {
                timerInterval = setInterval(() => {
                    if (isPaused || gameOver) return;
                    if (activePlayer === 1) {
                        timeLeft1--;
                        if (timeLeft1 <= 0) finish(1);
                    } else {
                        timeLeft2--;
                        if (timeLeft2 <= 0) finish(2);
                    }
                    render();
                }, 1000);
            }
            render();
        }

        // 終了処理
        function finish(loser) {
            gameOver = true;
            clearInterval(timerInterval);
            const sideL = document.getElementById('side-left');
            const sideR = document.getElementById('side-right');

            if (loser === 1) {
                sideL.className = 'timer-side lose';
                sideR.className = 'timer-side win';
                sideL.innerHTML = '<div class="time-val">LOSE</div>';
                sideR.innerHTML = '<div class="time-val">WIN</div>';
            } else {
                sideR.className = 'timer-side lose';
                sideL.className = 'timer-side win';
                sideR.innerHTML = '<div class="time-val">LOSE</div>';
                sideL.innerHTML = '<div class="time-val">WIN</div>';
            }
        }

        // 一時停止
        document.getElementById('pause-btn').onclick = (e) => {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            e.target.textContent = isPaused ? "RESUME" : "PAUSE";
            render();
        };

        // リセット
        document.getElementById('reset-btn').onclick = () => {
            location.reload(); // 状態が多いためリロードが最も確実
        };

        // 初期表示
        render();
    </script>
</body>
</html>
