<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>対局タイマー + ランダムナンバー</title>
    <style>
        :root {
            --bg-color: #222;
            --active-color: #4CAF50;
            --pause-color: #ff9800;
            --win-color: #ffd700;
            --lose-color: #ff4b2b;
            --number-color: #00d4ff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            user-select: none;
        }

        /* 画面上部の数字表示エリア */
        #number-display {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12vw;
            font-weight: 900;
            color: var(--number-color);
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }

        /* リセット表示の時のサイズ調整 */
        .reset-text {
            font-size: 8vw !important;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .timer-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            outline: none;
            transition: all 0.3s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding-top: 10vh;
        }

        #side-left { background-color: #333; color: #aaa; }
        #side-right { background-color: #444; color: #aaa; }

        .active { background-color: var(--active-color) !important; color: white !important; }
        .time-display { font-size: 15vw; font-weight: 800; font-family: monospace; }
        .status-label { font-size: 3vw; font-weight: bold; opacity: 0.7; }

        .win { background-color: var(--win-color) !important; color: #000 !important; }
        .lose { background-color: var(--lose-color) !important; color: white !important; }

        .controls {
            position: absolute;
            bottom: 10%; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .btn-ctrl {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #pause-btn { background-color: var(--pause-color); color: white; }
        #reset-btn { background-color: #666; color: white; }
    </style>
</head>
<body>

    <div id="number-display">--</div>

    <div class="controls">
        <button id="pause-btn" class="btn-ctrl">PAUSE</button>
        <button id="reset-btn" class="btn-ctrl">RESET</button>
    </div>

    <div class="container">
        <button id="side-left" class="timer-side">
            <div class="status-label">PLAYER 1</div>
            <div id="display-left" class="time-display">05:00</div>
        </button>

        <button id="side-right" class="timer-side">
            <div class="status-label">PLAYER 2</div>
            <div id="display-right" class="time-display">05:00</div>
        </button>
    </div>
